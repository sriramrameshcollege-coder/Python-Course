[project]
name = "expense-tracker"
version = "0.1.0"
description = "A simple command-line expense tracker built for an Intro to Python course, demonstrating and utilizing all concepts."
readme = "README.md"
authors = [
    { name = "sriramrameshcollege-coder", email = "sriramramesh.college@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[project.scripts]
expense-tracker = "expense_tracker.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
